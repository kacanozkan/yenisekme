<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Mini Tarayıcı</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f5f5f5; }
    input, button { padding: 10px; font-size: 16px; }
    ul { margin-top: 20px; padding-left: 0; }
    li { background: white; margin: 10px 0; padding: 10px; border-radius: 8px; list-style: none; }
    a { text-decoration: none; color: #007bff; }
  </style>
</head>
<body>
  <h2>Adres Gir</h2>
  <input type="text" id="urlInput" placeholder="https://ornek.com">
  <button onclick="goToPage()">Git</button>

  <h3>Geçmiş</h3>
  <ul id="historyList"></ul>

  <script>
    function loadHistory() {
      let history = JSON.parse(localStorage.getItem('history')) || [];
      let list = document.getElementById('historyList');
      list.innerHTML = '';
      history.forEach(url => {
        let li = document.createElement('li');
        li.innerHTML = `<a href="${url}" target="_blank">${url}</a>`;
        list.appendChild(li);
      });
    }

    function saveToHistory(url) {
      let history = JSON.parse(localStorage.getItem('history')) || [];
      if (!history.includes(url)) {
        history.push(url);
        localStorage.setItem('history', JSON.stringify(history));
      }
    }

    function goToPage() {
      let url = document.getElementById('urlInput').value;
      if (!url.startsWith('http')) {
        alert('Lütfen geçerli bir URL girin.');
        return;
      }
      saveToHistory(url);
      window.open(url, '_blank'); // Yeni sekmede aç
      loadHistory();
    }

    // Sayfa açıldığında geçmişi yükle
    loadHistory();
  </script>
</body>
</html>
